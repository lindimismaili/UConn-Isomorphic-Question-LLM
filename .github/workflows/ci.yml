name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff openpyxl
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest
