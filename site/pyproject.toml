[project]
name = "uconn-isomorphic-question-generator"
version = "1.0.0"
requires-python = ">=3.10,<3.14"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["archive", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-ra"
