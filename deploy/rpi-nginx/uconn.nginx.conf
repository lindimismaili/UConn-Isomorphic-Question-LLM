server {
    listen 80;
    server_name uconn.lindimismaili.com;

    root /var/www/uconn/Site;
    index index.html;

    # Increase max body size for file uploads (Cloudflare free tier allows up to 100MB)
    client_max_body_size 100m;
    
    # Increase timeouts for large uploads through Cloudflare
    client_body_timeout 300s;
    send_timeout 300s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important: Pass through Cloudflare headers
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;

        # SSE / long-running requests
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        
        # Disable request buffering for uploads (stream directly to backend)
        proxy_request_buffering off;
    }
}

